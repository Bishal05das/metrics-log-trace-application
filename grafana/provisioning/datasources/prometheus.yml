apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # A FIXED uid is the important part. Dashboard JSON references its
    # datasource by uid, so if Grafana generates a random one on each install
    # your committed dashboards point at a datasource that does not exist and
    # every panel shows "Datasource not found". Pin it, and reference this
    # exact string from every dashboard.
    uid: prometheus
    # Service name on the compose network, and the INTERNAL port (9090), not
    # the published one (9095). Grafana talks to Prometheus container-to-
    # container; the host port mapping is irrelevant here.
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Lets Grafana pick sensible step sizes and warn about queries that would
      # return absurd numbers of points.
      timeInterval: 5s
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 3.1.0

      # Exemplars: the metrics → traces link.
      #
      # With this set, any histogram panel gets an "Exemplars" toggle, and the
      # diamond markers it draws are clickable — each one carries the trace_id
      # of one real request that landed in that bucket.
      #
      # `name` must match the exemplar label the application emits; see
      # exemplarTraceIDLabel in internal/metrics/exemplar.go.
      #
      # `url` opens an external link, which works TODAY with no trace backend —
      # the placeholder below just echoes the ID back. Once Tempo or Jaeger is
      # running, replace the whole `url` line with:
      #
      #     datasourceUid: tempo
      #
      # and the click navigates straight into the trace view instead.
      # METRICS → TRACES, the link this whole exemplar machinery exists for.
      #
      # `datasourceUid` rather than `url`: clicking an exemplar diamond now opens
      # the trace INSIDE Grafana, next to the histogram that led you there,
      # instead of navigating away to an external page. Until Jaeger existed this
      # was a placeholder URL — the hook was built and pointed at nothing.
      #
      # `name` must match the exemplar label the application emits; see
      # exemplarTraceIDLabel in internal/metrics/exemplar.go.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger
          urlDisplayLabel: "View trace"
