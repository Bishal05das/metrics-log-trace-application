apiVersion: 1

# Elasticsearch as a Grafana datasource, IN ADDITION to Kibana.
#
# Kibana is the better log explorer — Discover, field stats, and saved searches
# have no real equivalent here. This datasource exists for the other half of the
# job: putting log panels on the SAME dashboard as the metrics that led you
# there. During an incident the expensive part is not reading logs, it is
# switching tools and re-entering the time range and the filter in a second UI,
# losing your place twice.
#
# So: Kibana to explore, Grafana to correlate.
datasources:
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    uid: elasticsearch
    # Container-to-container, so the INTERNAL port (9200), not the published
    # one (9201) — same reasoning as the Prometheus datasource.
    url: http://elasticsearch:9200
    # The daily indices written by logstash/pipeline/orders.conf.
    database: "orders-logs-*"
    editable: false
    jsonData:
      # Must match the mapping in elasticsearch/index-template.json. Point this
      # at a field that is not a date and every panel silently returns nothing.
      timeField: "@timestamp"
      esVersion: "8.0.0"
      # Tells Grafana the indices are daily, so a query over a 30m window hits
      # one index instead of fanning out across every index in the pattern.
      interval: Daily
      index: "[orders-logs-]YYYY.MM.DD"
      maxConcurrentShardRequests: 5
      logMessageField: message
      logLevelField: level

      # LOGS → TRACES.
      #
      # Makes trace_id a clickable link on every log line, opening the trace in
      # Jaeger. This is the cheapest of the three cross-pillar links to build
      # and the one used most: you are almost always reading logs when you
      # decide you want the trace.
      #
      # `field` is matched against the document's field name, so it depends on
      # trace_id surviving the Logstash pipeline as a top-level key — which is
      # why logstash/pipeline/orders.conf parses our JSON into the root rather
      # than into a nested object.
      dataLinks:
        - field: trace_id
          name: "View trace in Jaeger"
          datasourceUid: jaeger
          # The captured value IS the whole field; no regex extraction needed.
          matcherRegex: "(.+)"
          url: "$${__value.raw}"
