global:
  scrape_interval: 15s

  # A scrape that takes longer than this is abandoned and recorded as a
  # failure. It MUST be shorter than scrape_interval, or scrapes overlap.
  scrape_timeout: 10s

  
  evaluation_interval: 15s

 
  external_labels: #these labels are automatically added to all metrics
    cluster: local
    env: dev

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  
  - job_name: orders-api

    
    scrape_interval: 5s
    scrape_timeout: 4s

    metrics_path: /metrics

    
    scrape_protocols:
      - PrometheusProto
      - OpenMetricsText1.0.0
      - PrometheusText0.0.4

    
    always_scrape_classic_histograms: true

    
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
        refresh_interval: 10s

    
    relabel_configs:
      
      - source_labels: [__address__]
        target_label: instance
        replacement: orders-api-local

    
    metric_relabel_configs:
      
      - source_labels: [__name__]
        regex: go_gc_heap_(allocs|frees)_by_size_bytes_bucket
        action: drop

  
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  
  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  # The LOGS pillar, watched by the METRICS pillar.
  #
  # This is the pattern worth taking away: a pillar cannot report its own death.
  # Elasticsearch cannot alert you that Elasticsearch stopped receiving logs —
  # by then the alert has nowhere to come from. Prometheus can, and the
  # document count it scrapes here is an END-TO-END signal: a healthy Logstash
  # only proves one hop, whereas documents arriving in Elasticsearch prove the
  # app wrote them, Docker stored them, Logstash parsed them and ES indexed them.
  - job_name: elasticsearch
    scrape_interval: 30s
    static_configs:
      - targets:
          - elasticsearch-exporter:9114
    metric_relabel_configs:
      # The exporter emits per-index series for EVERY index, Kibana's own
      # .kibana_* internals included. They churn on upgrade and are of no
      # interest here — drop them at scrape time rather than storing them.
      - source_labels: [index]
        regex: "\\..*"
        action: drop

  # The TRACES pillar, watched by the METRICS pillar — the third instance of the
  # same rule: a pillar cannot report its own death.
  #
  # jaeger_collector_spans_saved_by_svc_total is the end-to-end signal here, and
  # it is worth preferring over spans_RECEIVED: received proves the collector got
  # them, saved proves Elasticsearch accepted them. The gap between the two is
  # exactly where a storage outage hides.
  - job_name: jaeger
    scrape_interval: 30s
    static_configs:
      - targets:
          - jaeger:14269
    metric_relabel_configs:
      # `host` is the container ID, so it changes on every rebuild and would
      # orphan a time series each time — the same churn problem as an unpinned
      # `instance`, one level down.
      - regex: "host"
        action: labeldrop
