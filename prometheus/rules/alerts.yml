# Alerting rules.
#
# The guiding principle, and the one most alert sets violate: ALERT ON SYMPTOMS
# THE USER FEELS, not on causes. "p99 latency is 3s" is a symptom — always worth
# waking someone for. "CPU is at 90%" is a cause; if nothing is actually slow,
# it is not an incident, it is a fact. Cause-based alerts are how teams end up
# with 200 rules nobody trusts.
#
# Every rule here carries:
#   for:         how long the condition must hold. Without it you page on a
#                single bad scrape, and your alerts flap.
#   severity:    routes the notification (see alertmanager.yml).
#   summary:     one line, shown in the notification title.
#   description: the numbers, templated, so the page itself tells you the scale.
#   runbook_url: what to DO. An alert without a runbook is a puzzle handed to
#                someone at 3am.

groups:
  # ---------------------------------------------------------------------------
  - name: orders_availability
    rules:
      # The most important alert in any system, and the one people forget:
      # fires when the target STOPS BEING SCRAPED. Threshold alerts cannot fire
      # if there is no data — a crashed process makes every other rule here go
      # silent, not red.
      - alert: OrdersTargetDown
        expr: up{job="orders-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: orders
        annotations:
          summary: "orders-api target {{ $labels.instance }} is down"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} for over 1 minute. Every other orders alert is blind while this is firing."
          runbook_url: "https://runbooks.internal/orders/target-down"

      # The complementary case: the target is UP but a metric has vanished —
      # someone deleted the instrumentation, or a code path stopped executing.
      # absent() is the only way to alert on a metric that does not exist,
      # because a selector matching nothing produces no series to compare.
      - alert: OrdersRequestMetricMissing
        expr: absent(orders_http_requests_total{job="orders-api"})
        for: 5m
        labels:
          severity: critical
          service: orders
        annotations:
          summary: "orders_http_requests_total has disappeared"
          description: "The target is up but is no longer exposing request metrics. Instrumentation was likely removed or renamed in a deploy."
          runbook_url: "https://runbooks.internal/orders/metric-missing"

      - alert: OrdersHighErrorRate
        expr: job:orders_http_error_ratio:rate5m > 0.05
        for: 2m
        # keep_firing_for stops the alert resolving the instant the ratio dips
        # below the threshold. Without it, a condition oscillating around the
        # line produces a stream of firing/resolved pairs — the fastest way to
        # train a team to ignore your alerts.
        keep_firing_for: 5m
        labels:
          severity: critical
          service: orders
        annotations:
          summary: "orders-api 5xx rate is {{ $value | humanizePercentage }}"
          description: "5xx responses are {{ $value | humanizePercentage }} of traffic over the last 5m, against a 5% threshold."
          runbook_url: "https://runbooks.internal/orders/high-error-rate"

      - alert: OrdersHighLatency
        expr: job_route:orders_http_request_duration_seconds:p99_5m > 0.25
        for: 3m
        labels:
          severity: warning
          service: orders
        annotations:
          summary: "p99 latency on {{ $labels.route }} is {{ $value | humanizeDuration }}"
          description: "99th percentile latency for {{ $labels.route }} is {{ $value | humanizeDuration }}, above the 250ms objective."
          runbook_url: "https://runbooks.internal/orders/high-latency"

      - alert: OrdersHandlerPanics
        expr: increase(orders_http_panics_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          service: orders
        annotations:
          summary: "handler panic on {{ $labels.route }}"
          description: "{{ $value | printf \"%.0f\" }} panic(s) recovered on {{ $labels.route }} in the last 5m. Any panic in production is a bug."
          runbook_url: "https://runbooks.internal/orders/panic"

  # ---------------------------------------------------------------------------
  # Multi-window, multi-burn-rate SLO alerts.
  #
  # This is what Google's SRE workbook actually recommends and what almost
  # nobody implements. The idea:
  #
  # An SLO of 99% availability over 30 days gives you an ERROR BUDGET of 1%.
  # "Burn rate" is how fast you are spending it: burn rate 1 exhausts the
  # budget exactly at the end of the window; burn rate 14.4 exhausts it in
  # 30d/14.4 ≈ 2 days.
  #
  # Why TWO windows per alert? Each solves the other's flaw:
  #   - The LONG window (1h) is stable but slow to fire and, worse, slow to
  #     RESOLVE — it keeps the alert active long after the incident ended.
  #   - The SHORT window (5m) is fast and resolves promptly, but alone it
  #     fires on every transient blip.
  # Requiring both to breach gives fast detection AND fast reset.
  #
  # Why TWO alerts at different rates? Severity should follow urgency:
  #   - Burning 14.4x means you exhaust a month's budget in 2 days. Page now.
  #   - Burning 6x means you exhaust it in 5 days. A ticket is enough.
  # ---------------------------------------------------------------------------
  - name: orders_slo_burn
    rules:
      # 99% availability SLO → 1% error budget.
      # 14.4 × 0.01 = 0.144 → 14.4% error rate sustained.
      - alert: OrdersAvailabilityBudgetBurnFast
        expr: |
          job:orders_slo_availability_errors:ratio_rate1h > (14.4 * 0.01)
          and
          job:orders_slo_availability_errors:ratio_rate5m > (14.4 * 0.01)
        for: 2m
        labels:
          severity: critical
          service: orders
          slo: availability
        annotations:
          summary: "burning availability budget 14.4x — 30d budget gone in ~2 days"
          description: "5xx ratio is {{ $value | humanizePercentage }} over both 1h and 5m windows. At this rate the 30-day error budget is exhausted in about 2 days."
          runbook_url: "https://runbooks.internal/orders/slo-burn"

      # 6 × 0.01 = 0.06 → 6% error rate sustained. Budget gone in ~5 days.
      - alert: OrdersAvailabilityBudgetBurnSlow
        expr: |
          job:orders_slo_availability_errors:ratio_rate6h > (6 * 0.01)
          and
          job:orders_slo_availability_errors:ratio_rate30m > (6 * 0.01)
        for: 15m
        labels:
          severity: warning
          service: orders
          slo: availability
        annotations:
          summary: "burning availability budget 6x — 30d budget gone in ~5 days"
          description: "5xx ratio is {{ $value | humanizePercentage }} over both 6h and 30m windows."
          runbook_url: "https://runbooks.internal/orders/slo-burn"

      # 99% of requests under 250ms → 1% may be slower.
      - alert: OrdersLatencyBudgetBurnFast
        expr: |
          job:orders_slo_latency_errors:ratio_rate1h > (14.4 * 0.01)
          and
          job:orders_slo_latency_errors:ratio_rate5m > (14.4 * 0.01)
        for: 2m
        labels:
          severity: critical
          service: orders
          slo: latency
        annotations:
          summary: "burning latency budget 14.4x"
          description: "{{ $value | humanizePercentage }} of requests are slower than 250ms across both 1h and 5m windows."
          runbook_url: "https://runbooks.internal/orders/slo-burn"

  # ---------------------------------------------------------------------------
  - name: orders_database
    rules:
      # The alert that would have caught the Phase 3 experiment, where every
      # query metric looked healthy and users saw 1.15s responses.
      - alert: OrdersDBPoolSaturated
        expr: job:orders_db_pool_acquire_wait_seconds:p99_5m > 0.05
        for: 2m
        labels:
          severity: critical
          service: orders
        annotations:
          summary: "database pool saturated — p99 acquire wait {{ $value | humanizeDuration }}"
          description: "Requests are queueing for a database connection ({{ $value | humanizeDuration }} at p99). Query execution time is NOT the problem — check pool size and long-held connections."
          runbook_url: "https://runbooks.internal/orders/db-pool-saturated"

      - alert: OrdersDBPoolNearCapacity
        expr: job:orders_db_pool_utilisation:ratio > 0.9
        for: 5m
        labels:
          severity: warning
          service: orders
        annotations:
          summary: "database pool {{ $value | humanizePercentage }} utilised"
          description: "Sustained high utilisation. Healthy on its own, but you have no headroom for a traffic spike."
          runbook_url: "https://runbooks.internal/orders/db-pool-capacity"

      - alert: OrdersDBQueryErrors
        expr: sum by (job, query, kind) (rate(orders_db_query_errors_total[5m])) > 0.1
        for: 3m
        labels:
          severity: warning
          service: orders
        annotations:
          summary: "database errors on {{ $labels.query }} (SQLSTATE {{ $labels.kind }})"
          description: "{{ $labels.query }} is failing at {{ $value | printf \"%.2f\" }}/s with SQLSTATE {{ $labels.kind }}."
          runbook_url: "https://runbooks.internal/orders/db-errors"

  # ---------------------------------------------------------------------------
  # Background work. Nobody is waiting on a socket, so none of these failures
  # show up as errors or latency anywhere else — the worker just stops.
  # ---------------------------------------------------------------------------
  - name: orders_worker
    rules:
      # The heartbeat. This fires even when there is no work to do, because
      # idle ticks are recorded as result="empty" — which is exactly why that
      # distinction was worth making in Phase 4.
      - alert: OrdersWorkerStopped
        expr: sum by (job) (rate(orders_worker_runs_total[5m])) == 0
        for: 3m
        labels:
          severity: critical
          service: orders
        annotations:
          summary: "order worker has stopped running"
          description: "No worker iterations in 5 minutes. Orders will accumulate in `pending` and no HTTP metric will show it."
          runbook_url: "https://runbooks.internal/orders/worker-stopped"

      # Age, not length. A big queue that drains fast is fine; a small one
      # where the oldest item is an hour old is an incident.
      - alert: OrdersBacklogAgeHigh
        expr: orders_backlog_oldest_age_seconds > 300
        for: 5m
        labels:
          severity: warning
          service: orders
        annotations:
          summary: "oldest pending order is {{ $value | humanizeDuration }} old"
          description: "The oldest unprocessed order has been waiting {{ $value | humanizeDuration }}, above the 5m threshold."
          runbook_url: "https://runbooks.internal/orders/backlog-age"

      # Alerting on the FRESHNESS of a metric, not its value.
      #
      # orders_backlog_* are cached gauges refreshed on a 15s ticker. If that
      # refresher dies, the gauges freeze at their last plausible value and
      # every backlog alert above goes quietly, permanently green. This is the
      # price of not querying at scrape time, and this alert is how you pay it.
      - alert: OrdersBacklogMetricsStale
        expr: time() - orders_backlog_last_refresh_timestamp_seconds > 90
        for: 2m
        labels:
          severity: warning
          service: orders
        annotations:
          summary: "backlog metrics are {{ $value | humanizeDuration }} stale"
          description: "The backlog refresher has not updated in {{ $value | humanizeDuration }}. Backlog gauges are frozen and the alerts based on them are blind."
          runbook_url: "https://runbooks.internal/orders/backlog-stale"

      # OrdersBacklogMetricsStale above catches the refresher when it stops
      # ENTIRELY. This catches it while it is still running and failing, which
      # is both more common and easier to miss: each attempt errors, the
      # timestamp never advances, and — because a failed refresh deliberately
      # leaves the previous gauge values in place rather than zeroing them —
      # the dashboard keeps showing a plausible, frozen backlog.
      #
      # It fires ~1m before the staleness alert (2 failures at a 15s interval,
      # for 1m) because it names the actual cause. "Backlog refreshes are
      # failing" sends you to the database; "backlog metrics are stale" only
      # tells you a number stopped moving.
      - alert: OrdersBacklogRefreshFailing
        expr: increase(orders_backlog_refresh_errors_total[5m]) > 2
        for: 1m
        labels:
          severity: warning
          service: orders
        annotations:
          summary: "backlog refresh is failing ({{ $value | printf \"%.0f\" }} errors in 5m)"
          description: "The backlog refresher is running but its queries are failing. The backlog gauges are frozen at their last values and every alert based on them is blind."
          runbook_url: "https://runbooks.internal/orders/backlog-refresh-failing"

      # A recovered panic in a background goroutine.
      #
      # Any value above zero is worth waking up for. Unlike an HTTP panic — which
      # the recovery middleware turns into a 500 the caller sees — this one has
      # no external symptom at all: the batch is silently abandoned, its orders
      # stay in `processing`, and every RED metric stays green. The `stage`
      # label separates "one order is poison" (process_order) from "the claim
      # query is broken" (batch) from "the backlog refresher is broken".
      - alert: OrdersWorkerPanics
        expr: increase(orders_worker_panics_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
          service: orders
        annotations:
          summary: "background worker panicked in stage {{ $labels.stage }}"
          description: "{{ $value | printf \"%.0f\" }} recovered panic(s) in the {{ $labels.stage }} stage. Before recovery existed this crashed the whole process; now it silently abandons work. Check the stack trace in the logs."
          runbook_url: "https://runbooks.internal/orders/worker-panic"

      - alert: OrdersPaymentFailureRateHigh
        expr: job:orders_payment_failure:ratio_rate5m > 0.25
        for: 5m
        labels:
          severity: critical
          service: orders
        annotations:
          summary: "payment failure rate is {{ $value | humanizePercentage }}"
          description: "{{ $value | humanizePercentage }} of orders are failing payment, against a ~8% baseline. Every technical metric can be green while this fires."
          runbook_url: "https://runbooks.internal/orders/payment-failures"

  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # The LOGS pipeline, alerted on from the METRICS pillar.
  #
  # None of these can be written in Elasticsearch, and that is the point: a
  # store cannot alert you that it stopped being written to. The observer has to
  # be a different system from the observed.
  # ---------------------------------------------------------------------------
  - name: orders_logs
    rules:
      # THE alert for this pillar.
      #
      # Everything else about logging fails loudly — a crashed Logstash, a red
      # cluster. This one catches the quiet failure: every container is up and
      # healthy, and nothing is arriving. A parse error, a mapping conflict, a
      # full sincedb, a changed log path. The dashboard stays green and you
      # discover it during the next incident, when you go to read the lines and
      # there are none.
      #
      # The `and` clause is load-bearing. Without it this fires every night on
      # an idle service, and an alert that cries wolf gets muted, which is
      # strictly worse than not having it.
      - alert: OrdersLogShippingStopped
        expr: |
          increase(
            sum(elasticsearch_indices_docs_primary{index=~"orders-logs-.*"})[10m:1m]
          ) == 0
          and
          sum(rate(orders_http_requests_total[10m])) > 0
        for: 5m
        labels:
          severity: critical
          service: orders
        annotations:
          summary: "no logs have reached Elasticsearch in 10 minutes"
          description: "The service is serving traffic but the orders-logs-* indices have not grown. Logs are being written and lost somewhere between the container and Elasticsearch. Check `make elk-health` and the Logstash container logs."
          runbook_url: "https://runbooks.internal/orders/log-shipping-stopped"

      # A red cluster means shards are unassigned and writes are failing or
      # about to. Yellow is EXPECTED on a single node — replicas cannot be
      # allocated with nowhere to put them — so alerting on "not green" here
      # would fire forever in this setup and teach you to ignore it.
      - alert: OrdersElasticsearchUnhealthy
        expr: elasticsearch_cluster_health_status{color="red"} == 1
        for: 2m
        labels:
          severity: critical
          service: orders
        annotations:
          summary: "Elasticsearch cluster {{ $labels.cluster }} is RED"
          description: "Primary shards are unassigned. Log ingestion is failing or will begin failing; new documents may be rejected."
          runbook_url: "https://runbooks.internal/orders/elasticsearch-red"

      - alert: OrdersElasticsearchDown
        expr: elasticsearch_up == 0
        for: 2m
        labels:
          severity: critical
          service: orders
        annotations:
          summary: "the Elasticsearch exporter cannot reach Elasticsearch"
          description: "Either Elasticsearch is down or the exporter cannot talk to it. Logs are accumulating in Docker's json-file driver and will be lost when those files rotate."
          runbook_url: "https://runbooks.internal/orders/elasticsearch-down"

      # Sampling is a cost control, not a normal operating mode. A sustained
      # non-zero drop rate means a hot path is logging far more than intended —
      # worth a ticket, never a page.
      #
      # This reads orders_log_records_* , counted inside the application BEFORE
      # sampling. An earlier version had to infer it from Elasticsearch document
      # counts, which was doubly wrong: it measured the pillar from downstream
      # of itself (so a shipping outage erased the measurement), and it could
      # not separate "we are logging more" from "we are shipping more of what we
      # already logged".
      - alert: OrdersLogSamplingPressure
        expr: |
          sum(rate(orders_log_records_dropped_total[10m]))
          / clamp_min(sum(rate(orders_log_records_total[10m])), 1e-9)
          > 0.2
        for: 15m
        labels:
          severity: warning
          service: orders
        annotations:
          summary: "{{ $value | humanizePercentage }} of log records are being dropped"
          description: "The sampler is discarding a sustained fraction of records, which means something is logging far above the {{ with printf \"1\" }}{{ end }}configured budget. Find the message with `orders: errors and warnings` in Kibana, or aggregate on message.keyword. Dropped lines are counted, not lost silently — but they are not in Elasticsearch either."
          runbook_url: "https://runbooks.internal/orders/log-sampling-pressure"

      # DEBUG left on after an incident is the most common way a log bill
      # doubles overnight. The runtime level switch that makes debugging easy
      # (`make log-level L=debug`) is exactly what makes this easy to forget,
      # so the switch needs a matching alarm.
      - alert: OrdersDebugLoggingLeftOn
        expr: sum(rate(orders_log_records_total{level="DEBUG"}[15m])) > 0
        for: 30m
        labels:
          severity: warning
          service: orders
        annotations:
          summary: "DEBUG logging has been on for 30 minutes"
          description: "The service is emitting DEBUG records. That is correct during an investigation and expensive afterwards — every line is stored and indexed. Turn it back down with `make log-level L=info`."
          runbook_url: "https://runbooks.internal/orders/debug-left-on"

  # ---------------------------------------------------------------------------
  # The TRACES pipeline. Same principle as orders_logs above.
  # ---------------------------------------------------------------------------
  - name: orders_traces
    rules:
      # The quiet failure, one pillar over. Every container healthy, requests
      # being served, and no spans arriving — a misconfigured endpoint, a
      # rejected batch, a full queue. Nothing about it is visible in the API's
      # own metrics, and you discover it when you open Jaeger during an incident
      # and the trace you need is not there.
      #
      # `saved`, not `received`: received proves the collector got the spans,
      # saved proves Elasticsearch accepted them.
      - alert: OrdersTraceIngestionStopped
        expr: |
          sum(rate(jaeger_collector_spans_saved_by_svc_total{svc="orders",result="ok"}[10m])) == 0
          and
          sum(rate(orders_http_requests_total[10m])) > 0
        for: 5m
        labels:
          severity: critical
          service: orders
        annotations:
          summary: "no spans have reached Jaeger in 10 minutes"
          description: "The service is serving traffic but no spans are being saved. Traces are being produced and lost between the application's BatchSpanProcessor and Elasticsearch. Check the api container for OTLP export errors and `make trace-health`."
          runbook_url: "https://runbooks.internal/orders/trace-ingestion-stopped"

      # Dropped spans mean the collector's queue overflowed — it is receiving
      # faster than storage accepts. Unlike log sampling, this loss is NOT
      # deliberate and NOT recorded anywhere in the data: the trace simply has a
      # hole in it, which is worse than having no trace, because an incomplete
      # waterfall reads as a complete one.
      - alert: OrdersTraceSpansDropped
        expr: increase(jaeger_collector_spans_dropped_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
          service: orders
        annotations:
          summary: "Jaeger dropped {{ $value | printf \"%.0f\" }} spans in 10 minutes"
          description: "The collector queue overflowed. Traces will have missing spans, and a waterfall with a hole in it looks identical to a complete one. Raise the queue size, scale the collector, or lower TRACING_SAMPLE_RATIO."
          runbook_url: "https://runbooks.internal/orders/trace-spans-dropped"

      - alert: OrdersJaegerDown
        expr: up{job="jaeger"} == 0
        for: 2m
        labels:
          severity: warning
          service: orders
        annotations:
          summary: "Jaeger is not being scraped"
          description: "Either Jaeger is down or Prometheus cannot reach it. Spans are buffering in the application's BatchSpanProcessor and will be dropped when that queue fills."
          runbook_url: "https://runbooks.internal/orders/jaeger-down"

  - name: orders_runtime
    rules:
      - alert: OrdersFileDescriptorsExhausting
        expr: process_open_fds{job="orders-api"} / process_max_fds{job="orders-api"} > 0.8
        for: 5m
        labels:
          severity: warning
          service: orders
        annotations:
          summary: "file descriptors {{ $value | humanizePercentage }} used"
          description: "The process is approaching its FD limit and will start refusing connections."
          runbook_url: "https://runbooks.internal/orders/fd-exhaustion"

      # A goroutine leak is a slow death: memory climbs, then OOMKill. The
      # absolute threshold is service-specific — set it well above your normal
      # peak, then tighten it once you know the real shape.
      - alert: OrdersGoroutineLeak
        expr: go_goroutines{job="orders-api"} > 2000
        for: 10m
        labels:
          severity: warning
          service: orders
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} goroutines — possible leak"
          description: "Goroutine count has been above 2000 for 10 minutes. Usually a missing context cancellation or an unclosed response body."
          runbook_url: "https://runbooks.internal/orders/goroutine-leak"
