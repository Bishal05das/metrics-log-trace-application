# The orders log pipeline: Docker json-file → parse → Elasticsearch.
#
# WHY READ FILES rather than have Docker push to Logstash directly.
#
# Docker can ship straight to Logstash with the `gelf` or `syslog` logging
# driver, which looks tidier — no host mount, no file tailing. It is the wrong
# trade here, and the reason is worth knowing: those drivers REPLACE json-file,
# and `docker logs` then returns nothing. Every debugging habit built on
# `docker compose logs api` dies with it, including this project's own
# `make logs-pretty` and `make traces`. Tailing the file leaves the local
# workflow intact and adds shipping alongside it.
#
# The cost is that Logstash must run as root to read /var/lib/docker/containers
# (root:root, mode 0710). In production you would instead run Filebeat as a
# DaemonSet with the same mount, or let the container runtime write to a
# location your shipper already owns.

input {
  file {
    path => "/var/lib/docker/containers/*/*-json.log"

    # ecs_compatibility must be disabled here. With it on (the 8.x default) the
    # file input writes the source path to [log][file][path] — but Docker's own
    # envelope already uses `log` as a STRING field for the line itself. The two
    # collide, `log` cannot be both a string and an object, and events are
    # silently dropped with a mapping conflict. Disabling it puts the path in
    # `path` instead and the conflict disappears.
    ecs_compatibility => disabled

    # Parses the DOCKER envelope: {"log":"<our line>\n","stream":"...","time":"..."}
    codec => json

    # "end", not "beginning", and this is worth understanding before you copy it.
    #
    # `beginning` backfills every byte of every log file the glob matches. On a
    # stack that has been running for days that is millions of lines — measured
    # here at 4.5M read to keep 1,020 — and the useful recent lines arrive LAST,
    # after minutes of CPU spent on history you already read in the terminal.
    #
    # A log pipeline's job is to carry what happens from now on. Use `beginning`
    # only for a genuine one-off backfill, and delete the sincedb to force it.
    start_position => "end"

    # Persisted on a named volume, so a Logstash restart resumes where it left
    # off instead of re-ingesting every log file from the beginning. Without
    # this you get duplicate documents on every restart.
    sincedb_path => "/usr/share/logstash/data/sincedb_docker"
  }
}

filter {
  # CHEAP GUARD FIRST.
  #
  # This glob matches every container on the host — Postgres, Prometheus,
  # Grafana, Kibana, Elasticsearch, and the multi-line span JSON our stdout
  # trace exporter writes to stderr. On this machine that is >99.9% of the
  # volume, and all of it is destined for the `drop` below.
  #
  # A substring test against the raw line costs a scan. Parsing the line as JSON
  # first, then discovering it is not ours, costs a full parse plus the field
  # objects to hold the result — for every line, forever. Order the cheap test
  # before the expensive one.
  if [log] !~ /"service":"orders"/ {
    drop { }
  }

  # Our application writes one JSON object per line to stdout. Parse it into the
  # top level of the event.
  #
  # This is the payoff for the application choosing JSON over text: there is no
  # grok pattern here. A regex-based parser is the single most common source of
  # breakage in a log pipeline — it silently stops matching the day someone adds
  # a field or changes a message, and you discover it during the next incident.
  json {
    source => "log"
    skip_on_invalid_json => true
  }

  # Everything else in /var/lib/docker/containers belongs to another container:
  # Postgres, Prometheus, Grafana, and the multi-line span JSON our stdout trace
  # exporter writes to stderr. None of it has a `service` field.
  #
  # Dropping here rather than filtering at query time is deliberate. An
  # Elasticsearch document costs storage and indexing CPU forever; the cheapest
  # document is the one you never wrote.
  if [service] != "orders" {
    drop { }
  }

  # The app's own timestamp, not the moment Logstash happened to read the line.
  # Those differ by however long the pipeline was backed up, and using ingest
  # time makes every incident look like it happened when your shipper caught up.
  date {
    match => ["time", "ISO8601"]
    target => "@timestamp"
    remove_field => ["time"]
  }

  # slog calls it "msg"; Kibana's log viewers and most of the Elastic ecosystem
  # expect "message".
  mutate {
    rename => { "msg" => "message" }
  }

  # Drop the Docker envelope and Logstash's own bookkeeping once parsed.
  mutate {
    remove_field => ["log", "stream", "path", "host", "@version", "event"]
  }

  # A numeric duration is what makes "slowest requests in the last hour"
  # sortable. Left as a string it sorts lexicographically, where 9ms > 100ms.
  if [duration_ms] {
    mutate { convert => { "duration_ms" => "float" } }
  }
  if [status] {
    mutate { convert => { "status" => "integer" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]

    # Daily indices. The index template (elasticsearch/index-template.json)
    # matches orders-logs-* and supplies both the field mappings and the ILM
    # policy, so nothing here needs to know about either.
    index => "orders-logs-%{+YYYY.MM.dd}"

    # Let the template own the mappings. Logstash ships a default template that
    # would otherwise be installed and fight ours.
    manage_template => false
  }
}
